name: Deploy to GitHub Pages

# Every push to the default branch, by hand, and every 3 hours: each run rescans every VIIRS
# fire pixel on Earth (last 8 days), rebuilds the "burning now" incidents and redeploys the site
# with the committed archive.
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WILDFIRE_RAW: data/raw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      # gazetteer and station list rarely change: keep them between runs
      - uses: actions/cache@v4
        with:
          path: |
            data/raw/ne_places.geojson
            data/raw/isd-history.csv
          key: live-reference-v1

      - name: Scan every VIIRS fire pixel on Earth
        id: scan
        continue-on-error: true
        run: python -m pipeline.scan_global --days 8 --out public/data/live

      - name: Build the fires burning now
        if: steps.scan.outcome == 'success'
        continue-on-error: true
        run: python -W ignore -m pipeline.live --max 10

      - name: Catalogue
        run: python -m pipeline.make_index

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
